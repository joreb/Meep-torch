[project]
name = "meep-torch"
version = "0.1.0"
description = "Differentiable 2D FDTD engine in PyTorch (meep-inspired)"
license = "MIT AND GPL-2.0-or-later AND GPL-3.0-only"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.6",
    "numpy>=1.24",
    "code-review-graph>=2.3.7",
    "igraph>=1.0.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
gds = [
    "gdstk>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "psutil>=5.9",
    "matplotlib>=3.10.9",
    "gdstk>=1.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meep_torch"]

[tool.pytest.ini_options]
markers = ["slow: long-running tests, excluded by default"]
addopts = "-m 'not slow'"
testpaths = ["tests"]
