[project]
name = "meep-torch"
version = "0.1.0"
description = "Differentiable FDTD/FDFD engine in PyTorch (meep-inspired)"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.6",
    "numpy>=1.24",
    "scipy>=1.11",
    "gdsfactory>=6.111.0",
    "torch-sla>=0.3.2",
]

[project.optional-dependencies]
gds = [
    "gdstk>=1.0.1",
]
# femwell is the FEM mode-solver oracle (GPL-3.0). Test-only -- it is NOT a
# runtime dep and never enters the wheel. Its setup.py hard-bounds Python
# <3.10, so the marker makes this extra a no-op on this project's >=3.10 floor
# (the guarded tests importorskip). Install it on a <3.10 box to run the
# femwell parity/overlap tests live: uv pip install '.[femwell]'
# femwell = [
#     "femwell; python_version < '3.10'",
# ]

[dependency-groups]
dev = [
    "pytest>=8",
    "psutil>=5.9",
    "matplotlib>=3.10.9",
    "gdstk>=1.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meep_torch"]

[tool.pytest.ini_options]
markers = ["slow: long-running tests, excluded by default"]
addopts = "-m 'not slow'"
testpaths = ["tests"]
