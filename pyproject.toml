[project]
name = "meep-torch"
version = "0.1.0"
description = "Differentiable FDTD/FDFD engine in PyTorch (meep-inspired)"
license = "MIT"
requires-python = ">=3.10"
# torch pinned to a cu128 build: the accelerated sparse backends
# (torch-strumpack cuda12x, torch-amgx cu128, cuDSS via nvmath[cu12])
# are ABI/runtime-tied to CUDA 12.x -- cu130 torch has no matching
# wheels (see wiki/TODO.md). Python pinned 3.12 (.python-version):
# nvmath-python ships cp310-cp312 only.
dependencies = [
    "torch==2.9.*",
    "numpy>=1.24",
    "scipy>=1.11",
    "gdsfactory>=6.111.0",
    "torch-sla[cudss]>=0.3.2",
]

[project.optional-dependencies]
gds = [
    "gdstk>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "psutil>=5.9",
    "matplotlib>=3.10.9",
    "gdstk>=1.0.1",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meep_torch"]

[tool.pytest.ini_options]
markers = ["slow: long-running tests, excluded by default"]
addopts = "-m 'not slow'"
testpaths = ["tests"]
