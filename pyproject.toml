[project]
name = "meep-torch"
version = "0.1.0"
description = "Differentiable FDTD/FDFD engine in PyTorch (meep-inspired)"
license = "MIT"
requires-python = ">=3.12,<3.13"
# torch pinned to a cu128 build: the accelerated sparse backends
# (torch-strumpack cuda12x, torch-amgx cu128, cuDSS via nvmath[cu12])
# are ABI/runtime-tied to CUDA 12.x -- cu130 torch has no matching
# wheels (see wiki/TODO.md). Python pinned 3.12 (.python-version):
# nvmath-python ships cp310-cp312 only.
dependencies = [
    "torch==2.9.*",
    "numpy>=1.24",
    "scipy>=1.11",
    "gdsfactory>=6.111.0",
    "torch-sla[cudss]>=0.3.2",
    "torch-strumpack",
    "torch-amgx",
]

[project.optional-dependencies]
gds = [
    "gdstk>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "psutil>=5.9",
    "matplotlib>=3.10.9",
    "gdstk>=1.0.1",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torch-strumpack = { url = "https://github.com/sparsexlab/torch-strumpack/releases/download/v0.0.1.dev7/torch_strumpack-0.0.1.dev0-0_cuda12x-cp312-cp312-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl" }
torch-amgx = { url = "https://github.com/sparsexlab/torch-amgx/releases/download/v0.1.0a12/torch_amgx-0.1.0a2-0_cu128-cp312-cp312-manylinux_2_34_x86_64.manylinux_2_35_x86_64.whl" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meep_torch"]

[tool.pytest.ini_options]
markers = ["slow: long-running tests, excluded by default"]
addopts = "-m 'not slow'"
testpaths = ["tests"]
