[project]
name = "meep-torch"
version = "0.1.0"
description = "Differentiable FDTD/FDFD engine in PyTorch (meep-inspired)"
# A GPL-2.0-or-later file ships in the package (core/bicgstab.py, derived
# from meep). The distribution is therefore subject to GPL terms even
# though every MIT file stays independently MIT -- see LICENSE.md.
license = "MIT AND GPL-2.0-or-later"
requires-python = ">=3.12,<3.13"
# torch pinned to a cu128 build: cuDSS via nvmath[cu12] and cupy-cuda12x
# are ABI/runtime-tied to CUDA 12.x -- cu130 torch has no matching
# wheels (see wiki/TODO.md). Python pinned 3.12 (.python-version):
# nvmath-python ships cp310-cp312 only.
# torch-strumpack / torch-amgx dropped: Linux-only wheels blocked Windows
# sync and neither was imported by the engine; the GPU sparse solve moves
# to cupy (cupyx.scipy.sparse.linalg), see wiki fdfd_gpu-sparse-direct-backends.
dependencies = [
    "torch==2.9.*",
    "numpy>=1.24",
    "scipy>=1.11",
    "gdsfactory>=6.111.0",
    "torch-sla[cudss]>=0.3.2",
    # "torch-strumpack",
    # "torch-amgx",
    "pymkl>=0.0.3",
    "pypardiso>=0.4.7",
    "cupy-cuda12x>=14.2.0",
    "sympy>=1.14.0",
]

[project.optional-dependencies]
gds = [
    "gdstk>=1.0.1",
]
# 3D band solves on the GPU (mpb planewave3d); every cupy import is lazy,
# CPU-only installs stay ~1 GB smaller: `uv sync --extra gpu`.
gpu = [
    "cupy-cuda12x[ctk]>=14.2.0",
]
# symbolic FDTD stencil experiments (symbolic branch, symbolic_test/):
# devito (symbolic PDE -> C codegen) and pylops (linear-operator FDTD).
# Both are heavy and Linux-friendly; lazy imports in symbolic_test/ keep
# the default install clean: `uv sync --extra symbolic`.
symbolic = [
    "devito>=4.8",
    "pylops>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "psutil>=5.9",
    "matplotlib>=3.10.9",
    "gdstk>=1.0.1",
    "h5py>=3.16.0",
    "typesafe-sdk>=0.7.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meep_torch"]

[tool.pytest.ini_options]
markers = ["slow: long-running tests, excluded by default"]
addopts = "-m 'not slow'"
testpaths = ["tests", "symbolic_test"]
